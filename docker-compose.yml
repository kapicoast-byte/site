# The deployable stack. Dokploy builds this directly when the app is set up as
# a "Docker Compose" application pointed at this repo — it runs exactly
# `docker compose -f ./docker-compose.yml up -d --build`, nothing more.
#
# One service. There is no database container: content lives in Firestore and
# uploads in Firebase Storage, both managed and both reached over the network
# with the same service-account credential.
#
# The service publishes no host port. That is deliberate, not an oversight: a
# fixed host-port bind caused a real failure — "Bind for 0.0.0.0:3000 failed:
# port is already allocated" — because another container on the same shared
# server already held 3000. Dokploy's reverse proxy (Traefik) reaches this
# container over `dokploy-network` by service name and container port, which it
# learns from the app's Domains settings in the dashboard.
#
# `dokploy-network` is external — created and owned by Dokploy. Without joining
# it, Traefik has no route in and every request returns its bare
# "404 page not found" even though the app is running perfectly.
#
# For local development, `docker-compose.override.yml` publishes port 3000 and
# redeclares that network as local. `docker compose up` (no `-f` flags) merges
# it automatically; Dokploy's explicit `-f ./docker-compose.yml` does not.
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      # Login is Firebase Auth and content is Firestore, so these are not
      # optional — the app cannot serve a page or sign anyone in without them.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL before starting}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:?set FIREBASE_SERVICE_ACCOUNT before starting}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:?set FIREBASE_WEB_API_KEY before starting}
      # Optional: unset means uploads fall back to the local disk at UPLOAD_DIR.
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-}
      UPLOAD_DIR: /app/uploads
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"
    networks:
      - dokploy-network

    # Is the server actually answering, as opposed to the process merely being
    # alive? During a deploy that is the question worth asking: the container
    # exists for a couple of seconds before Next binds the port, and "running"
    # says yes the whole time.
    #
    # /admin/login on purpose. It is the one prerendered static route in the
    # build, so it proves Next is serving without depending on Firestore. A
    # check against / would fail whenever Google was unreachable and report a
    # network problem as a dead container.
    #
    # wget, not curl: the image is node:22-alpine, where wget is busybox's and
    # curl is not installed.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/admin/login"]
      interval: 15s
      timeout: 4s
      retries: 3
      # Failures before this elapses do not count against `retries`, so a slow
      # boot is never mistaken for a broken one.
      start_period: 25s

volumes:
  uploads:

networks:
  # Created and owned by Dokploy, shared with its Traefik proxy. `external`
  # means "already exists, do not create it" — Compose errors out if it is
  # missing, which is a far better failure than silently starting a container
  # nothing can route to.
  dokploy-network:
    external: true
