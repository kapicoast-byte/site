# Local development stack. Dokploy does not need this file — it builds the
# Dockerfile and provides its own Postgres — but it lets you run the whole
# thing on your laptop with one command:  docker compose up
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kapi
      POSTGRES_PASSWORD: kapi
      POSTGRES_DB: kapicoast
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapi -d kapicoast"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kapi:kapi@db:5432/kapicoast?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kapicoast.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-please-change-me-32chars}
      UPLOAD_DIR: /app/uploads
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    volumes:
      - uploads:/app/uploads
    ports:
      - "3000:3000"

volumes:
  db-data:
  uploads:
